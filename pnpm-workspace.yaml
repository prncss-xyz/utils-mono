packages:
  - 'apps/*'
  - 'packages/*'

catalogMode: prefer

catalog:
  '@astryxdesign/cli': ^0.5.2
  '@astryxdesign/core': ^0.5.2
  '@astryxdesign/theme-neutral': ^0.5.2
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@commitlint/types': ^21.2.3
  '@fast-check/vitest': ^0.5.0
  '@playwright/test': ^1.64.1
  '@storybook/addon-a11y': ^10.6.0
  '@storybook/addon-docs': ^10.6.0
  '@storybook/addon-vitest': ^10.6.3
  '@storybook/react-vite': ^10.6.0
  '@types/node': ^26.4.1
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  fast-check: ^4.10.2
  hono: ^4.12.32
  knip: ^6.42.1
  oxc-transform-react: ^0.152.0
  playwright: ^1.62.0
  react: ^19.2.8
  react-dom: ^19.2.8
  sherif: ^1.13.0
  storybook: ^10.6.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@^1.4.0
  vite-plus: ^1.4.0
  vitest: 5.0.5
  zod: ^4.6.7

peerDependencyRules:
  allowedVersions:
    # vite is aliased to vite-plus-core, which bundles vite 8
    vite: '^1.4.0'
    # storybook does not declare vite-plus 1.x support yet
    vite-plus: '^1.4.0'

allowBuilds:
  '@astryxdesign/cli': true
  '@astryxdesign/core': true
  esbuild: true
